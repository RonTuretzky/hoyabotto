<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f0">
<title>ホヤボットに手を振ろう</title>
<link rel="preload" href="robot/preview.webp" as="image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E👋%3C/text%3E%3C/svg%3E">
<style>
  :root { --ink: #1d1b2f; --soft: #6b6880; --accent: #ff7a45; --bg: #fff8f0; --line: #eadfd3; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--ink);
         min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; }
  main { width: min(560px, 100%); padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  h1 { font-size: 27px; line-height: 1.3; margin: 0 0 8px; }
  p.lead { color: var(--soft); margin: 0 0 22px; font-size: 15.5px; line-height: 1.7; }
  h2 { font-size: 14px; letter-spacing: .06em; color: var(--soft); margin: 0 0 10px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 24px; }
  .emoji { position: relative; border: 3px solid var(--line); background: #fff; border-radius: 18px; padding: 12px 4px 9px; min-height: 96px;
           cursor: pointer; text-align: center; font: inherit; color: inherit; transition: transform .1s, border-color .1s, background .1s; touch-action: manipulation; }
  .emoji:active { transform: scale(.96); }
  .emoji .big { font-size: 44px; line-height: 1.1; display: block; }
  .emoji .label { font-size: 13px; color: var(--soft); display: block; margin-top: 4px; }
  .emoji.on { border-color: var(--accent); background: #fff1e8; }
  .emoji .order { position: absolute; top: 6px; right: 7px; background: var(--accent); color: #fff; border-radius: 99px;
                  width: 22px; height: 22px; font-size: 13px; line-height: 22px; font-weight: 700; display: none; }
  .emoji.on .order { display: block; }
  input { width: 100%; font: inherit; font-size: 22px; padding: 14px 16px; border-radius: 16px; border: 3px solid var(--line); outline: none; background: #fff; color: var(--ink); }
  input:focus { border-color: var(--accent); }
  button.go { width: 100%; margin-top: 16px; font: inherit; font-size: 20px; font-weight: 700; padding: 16px; min-height: 58px; border: 0; border-radius: 16px;
              background: var(--accent); color: #fff; cursor: pointer; touch-action: manipulation; }
  button.go:disabled { background: #e8c9b8; cursor: default; }
  .msg { min-height: 22px; margin-top: 12px; color: #c0392b; font-size: 15px; line-height: 1.6; }
  .ticket { text-align: center; padding: 8px 0 0; }
  .ticket .big { font-size: 76px; line-height: 1.1; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  .ticket h1 { font-size: 26px; margin-top: 6px; }
  .ticket p { font-size: 16.5px; color: var(--soft); line-height: 1.7; margin: 6px 0 0; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .hidden { display: none !important; }
  nav { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 18px; font-size: 14.5px; }
  nav a { padding: 6px 0; }
  a { color: var(--ink); }
  .status { padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px; font-size: 14.5px; line-height: 1.6; background: #fff; }
  .note { color: var(--soft); font-size: 13.5px; line-height: 1.7; margin: 8px 0 0; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  /* the invitation to the 3D page */
  .explore { position: relative; display: block; margin: 26px 0 0; border-radius: 22px; padding: 3px; text-decoration: none; color: var(--ink); text-align: left;
             background: conic-gradient(from var(--a, 0deg), #ff7a45, #ffd166, #2c86c7, #ff7a45); animation: spin 4s linear infinite, rise .7s .35s cubic-bezier(.2, .8, .2, 1) both; }
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --a: 360deg; } }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  .explore .in { background: #fff; border-radius: 19px; overflow: hidden; }
  .explore img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: #f3eee7; }
  .explore .txt { padding: 14px 16px 16px; display: grid; gap: 4px; }
  .explore b { font-size: 18px; line-height: 1.45; }
  .explore .sub { font-size: 14px; color: var(--soft); line-height: 1.6; }
  .explore .cta { margin-top: 10px; display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 700; font-size: 17px; position: relative; overflow: hidden; }
  .explore .cta i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.18); }
  .explore.counting .cta i { animation: fill var(--wait, 7s) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .stay { display: block; margin: 10px auto 0; background: none; border: 0; font: inherit; font-size: 14.5px; color: var(--soft); text-decoration: underline; padding: 8px 12px; cursor: pointer; }
  button.again { background: #fff; color: var(--ink); border: 3px solid var(--line); font-size: 17px; }
  @media (max-width: 380px) { .emoji .big { font-size: 38px; } .emoji { min-height: 88px; } h1 { font-size: 24px; } }
  @media (prefers-reduced-motion: reduce) { .explore, .ticket .big { animation: none; } .explore.counting .cta i { animation: none; } }
</style>
</head>
<body>
<main>
  <nav><a href="index.html">← ホヤボット</a><a href="screen.html" id="screen-link">画面を見る ↗</a></nav>
  <div class="status" id="connection" role="status">ショーに接続中…</div>
  <section id="form">
    <h1>ホヤボットにあいさつ 🤖</h1>
    <p class="lead">絵文字を1つ選んで名前を入れると、名前が画面に出ている間に、ロボットがその動きをします。</p>
    <h2>1 · 絵文字を1つ選ぶ</h2>
    <div class="grid" id="grid" role="radiogroup" aria-label="絵文字を1つ選ぶ"></div>
    <h2>2 · お名前</h2>
    <input id="name" maxlength="24" autocomplete="off" autocapitalize="off" enterkeyhint="send" placeholder="お名前" aria-label="お名前">
    <p class="note">名前かニックネームでどうぞ。順番待ちの列と大きな画面に表示されます。各回は進行役がスタートします。</p>
    <button class="go" id="go" disabled>ロボットに送る</button>
    <div class="msg" id="msg" role="alert"></div>
  </section>
  <section id="ticket" class="ticket hidden" aria-live="polite">
    <div class="big" id="t-emoji"></div>
    <h1 id="t-title"></h1>
    <p id="t-text"></p>
    <a class="explore hidden" id="explore" href="robot.html">
      <div class="in">
        <img src="robot/preview.webp" alt="ホヤボットが部品に分かれていく3Dアニメーション">
        <div class="txt">
          <b>待っている間に、ホヤボットを分解してみよう</b>
          <span class="sub">16個のサーボ、カメラ、3Dプリント部品。そして、これから目指す仕事まで。順番はページの上でお知らせします。</span>
          <span class="cta"><i></i>3Dで中身を見る →</span>
        </div>
      </div>
    </a>
    <button class="stay hidden" id="stay">このページで待つ</button>
    <button class="go again" id="again">もう一度送る</button>
  </section>
</main>
<script src="emoji-config.js"></script>
<script src="emoji-api.js"></script>
<script>
const JA = { '👋': '手を振る', '🤖': 'ダンス', '🎉': 'お祝い', '👀': '見回す' };
let catalog = [], picked = [], ticket = null, poll = null, online = false, submitting = false, armed = false, countdown = null;
const $ = id => document.getElementById(id);
if (!window.ROBOT_EMOJI_API) $('screen-link').href = '/screen';

function render() {
  if (catalog.length && !picked.length) picked = [catalog[0].key];
  $('grid').replaceChildren(...catalog.map(g => {
    const b = document.createElement('button');
    b.className = 'emoji' + (picked.includes(g.key) ? ' on' : '');
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(picked.includes(g.key)));
    const name = JA[g.emoji] || g.label;
    b.setAttribute('aria-label', name);
    const big = document.createElement('span'); big.className = 'big'; big.textContent = g.emoji;
    const label = document.createElement('span'); label.className = 'label'; label.textContent = name;
    const order = document.createElement('span'); order.className = 'order'; order.textContent = '✓';
    b.append(order, big, label);
    b.onclick = () => { picked = [g.key]; render(); };
    return b;
  }));
  $('go').disabled = !online || submitting || !(picked.length && $('name').value.trim());
  $('go').textContent = submitting ? '送信中…' : 'ロボットに送る';
}

async function load() {
  try {
    const s = await emojiFetch('/api/state');
    online = true; armed = s.armed; catalog = s.catalog;
    picked = picked.filter(key => catalog.some(g => g.key === key));
    $('connection').textContent = s.robot === 'waiting: robot connection is reconnecting'
      ? 'ロボットに再接続中です · 順番は保持されます'
      : s.armed ? 'ショー受付中 · 列に並べます' : '準備中 · 今のうちに列に並べます';
  } catch (e) {
    online = false; $('connection').textContent = e.message;
  }
  render();
  setTimeout(load, 5000);
}

const robotLink = t => `robot.html?ticket=${encodeURIComponent(t.id)}`;
function invite(t, auto) {
  const card = $('explore');
  card.href = robotLink(t);
  card.classList.remove('hidden');
  if (!auto || countdown || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const wait = 7000;
  card.style.setProperty('--wait', wait + 'ms');
  card.classList.add('counting'); $('stay').classList.remove('hidden');
  countdown = setTimeout(() => { if (ticket && ticket.state === 'queued') location.href = robotLink(ticket); }, wait);
}
function stopCountdown() { clearTimeout(countdown); countdown = 1; $('explore').classList.remove('counting'); $('stay').classList.add('hidden'); }
$('stay').onclick = stopCountdown;

$('name').oninput = render;
$('name').onkeydown = e => { if (e.key === 'Enter' && !$('go').disabled) $('go').click(); };
$('go').onclick = async () => {
  submitting = true; render(); $('msg').textContent = '';
  try {
    const body = await emojiFetch('/api/requests', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('name').value, gestures: picked }) });
    ticket = body; sessionStorage.setItem('hoyaTicket', body.id);
    $('name').blur(); showTicket(body); invite(body, true);
    pollTicket();
  } catch (e) { $('msg').textContent = e.message; }
  finally { submitting = false; render(); }
};

async function pollTicket() {
  if (!ticket) return;
  const rid = ticket.id;
  try {
    const t = await emojiFetch('/api/requests/' + rid);
    if (!ticket || ticket.id !== rid) return;
    ticket = t; showTicket(t);
    if (t.state !== 'queued' && t.state !== 'performing') { sessionStorage.removeItem('hoyaTicket'); return; }
  } catch (e) {
    if (!ticket || ticket.id !== rid) return;
    $('t-text').textContent = e.message + ' すでに並んでいるかもしれません。このページは自動で再接続します。';
  }
  poll = setTimeout(pollTicket, 1500);
}

function showTicket(t) {
  $('form').classList.add('hidden'); $('ticket').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  $('t-emoji').textContent = t.emojis.join('');
  if (t.state === 'queued') {
    $('t-title').textContent = `${t.name}さんは ${t.position}番目です`;
    $('t-text').textContent = t.waiting_reason
      ? (t.waiting_reason.includes('reconnecting') || t.waiting_reason.includes('checking robot')
        ? 'ロボットに接続中です。順番は保持されます。' : 'ロボットが前の動きを終えるところです。順番は保持されます。')
      : armed ? '名前が画面に出たら、ロボットが動き出します。' : '進行役が準備中です。順番は保持されます。';
  } else if (t.state === 'performing') {
    $('t-title').textContent = `${t.name}さんの番です！`;
    $('t-text').textContent = 'ロボットを見て 👀';
    if (countdown && countdown !== 1) stopCountdown();
  } else if (t.state === 'done') {
    $('t-title').textContent = `完了！ありがとう、${t.name}さん 🎉`; $('t-text').textContent = '';
    clearTimeout(poll);
  } else {
    $('t-title').textContent = 'ロボットがこの動きをできませんでした';
    $('t-text').textContent = 'ごめんなさい。担当者がロボットを確認しています。少ししてからもう一度どうぞ。';
    clearTimeout(poll);
  }
  if (t.state !== 'queued' && t.state !== 'performing') { $('explore').classList.remove('counting'); $('stay').classList.add('hidden'); }
}

$('again').onclick = () => {
  clearTimeout(poll); stopCountdown(); countdown = null; ticket = null; picked = []; $('name').value = '';
  sessionStorage.removeItem('hoyaTicket');
  $('explore').classList.add('hidden');
  $('ticket').classList.add('hidden'); $('form').classList.remove('hidden'); render(); $('name').focus();
};

// coming back from the 3D page: restore the ticket instead of an empty form
(async () => {
  const id = sessionStorage.getItem('hoyaTicket');
  if (id) { try { const t = await emojiFetch('/api/requests/' + id);
    if (t.state === 'queued' || t.state === 'performing') { ticket = t; showTicket(t); invite(t, false); pollTicket(); } else sessionStorage.removeItem('hoyaTicket'); } catch (_) {} }
})();
load();
</script>
</body>
</html>
