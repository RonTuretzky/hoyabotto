[project]
name = "xlerobot-farm"
version = "0.1.0"
description = "Farm program for a parked XLeRobot: adapters, skills, perception, care cycle, evidence, viewer, Jev/Astra, LLM-driven teaching."
requires-python = ">=3.10"
dependencies = [
  "lerobot[feetech,dataset,training]>=0.6",
  "pupil-apriltags",
  "opencv-python",
  "pyserial",
  "fastapi",
  "uvicorn",
  "pyyaml",
  "httpx",
  "numpy",
  "mcp",
]

[project.optional-dependencies]
dev = ["pytest"]
carton-kinematics = ["lerobot[kinematics]==0.6.1"]
twin = ["mujoco>=3.1", "pillow"]

[project.scripts]
farm = "farm.cli:main"
carton = "carton.cli:main"
carton-servo = "carton.servo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farm*", "carton*"]

[tool.setuptools.package-data]
"carton" = ["assets/wrist-camera/*.obj", "assets/wrist-camera/*.json"]
"farm.kinematics" = ["so101-assets.json"]
"farm.vendor.autocal.upstream_pr3282" = ["provenance.json"]
"farm.sim" = ["assets/xlerobot/*.xml", "assets/xlerobot/*.md", "assets/xlerobot/*.json", "assets/xlerobot/LICENSE", "assets/xlerobot/assets/*.stl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
