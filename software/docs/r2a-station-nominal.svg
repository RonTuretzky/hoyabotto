<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1100" height="760" fill="#fff"/>
  <text x="20" y="28" font-size="18" font-weight="bold">R2a station: NOMINAL CAD GEOMETRY in assembly frame A (mm). Not measured on the robot.</text>
  <text x="20" y="48" fill="#333">Scale 2 px = 1 mm. Numbered markers refer to the legend on the right. Hatched = grasp fins. Dotted = retainer frame. Dashed = trough (below the deck).</text>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.5"/></pattern>
  </defs>
  <!-- marker helper: circle with number -->
  <g id="defs"/>

  <!-- TOP VIEW: origin at (330, 250); +X right, +Y up -->
  <g transform="translate(330,250)">
    <text x="-240" y="-120" font-weight="bold">TOP VIEW (looking down). Origin = source XY origin on the deck top.</text>
    <rect x="-205" y="-85" width="360" height="170" fill="none" stroke="#000" stroke-dasharray="8 5" stroke-width="1.5"/>
    <rect x="-203" y="-83" width="356" height="166" fill="none" stroke="#000" stroke-width="2"/>
    <g fill="none" stroke="#666" stroke-width="1">
      <rect x="-101" y="-70" width="22" height="140" rx="11"/><rect x="-41" y="-70" width="22" height="140" rx="11"/>
      <rect x="19" y="-70" width="22" height="140" rx="11"/><rect x="79" y="-70" width="22" height="140" rx="11"/>
    </g>
    <rect x="-148" y="-66" width="296" height="132" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="2 3"/>
    <rect x="-140" y="-58" width="280" height="116" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="-148" y="-20" width="8" height="40" fill="url(#hatch)" stroke="#000"/>
    <rect x="140" y="-20" width="8" height="40" fill="url(#hatch)" stroke="#000"/>
    <rect x="-24" y="-79" width="48" height="12" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
    <rect x="-24" y="67" width="48" height="12" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="50" y2="0" stroke="#000" stroke-width="2"/><text x="54" y="4">+X</text>
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#000" stroke-width="2"/><text x="-8" y="-56">+Y</text>
    <circle cx="0" cy="0" r="3"/>
    <!-- markers -->
    <g font-weight="bold" font-size="12">
      <circle cx="-215" cy="-95" r="9" fill="#fff" stroke="#000"/><text x="-219" y="-91">1</text>
      <circle cx="-195" cy="95" r="9" fill="#fff" stroke="#000"/><text x="-199" y="99">2</text>
      <circle cx="-90" cy="-100" r="9" fill="#fff" stroke="#000"/><text x="-94" y="-96">3</text><line x1="-90" y1="-91" x2="-90" y2="-70" stroke="#000"/>
      <circle cx="-160" cy="-45" r="9" fill="#fff" stroke="#000"/><text x="-164" y="-41">4</text><line x1="-152" y1="-45" x2="-148" y2="-50" stroke="#000"/>
      <circle cx="-165" cy="0" r="9" fill="#fff" stroke="#000"/><text x="-169" y="4">5</text><line x1="-156" y1="0" x2="-148" y2="0" stroke="#000"/>
      <circle cx="165" cy="0" r="9" fill="#fff" stroke="#000"/><text x="161" y="4">5</text><line x1="156" y1="0" x2="148" y2="0" stroke="#000"/>
      <circle cx="45" cy="-95" r="9" fill="#fff" stroke="#000"/><text x="41" y="-91">6</text><line x1="36" y1="-90" x2="24" y2="-79" stroke="#000"/>
      <circle cx="45" cy="95" r="9" fill="#fff" stroke="#000"/><text x="41" y="99">6</text><line x1="36" y1="90" x2="24" y2="79" stroke="#000"/>
      <circle cx="-60" cy="-105" r="9" fill="#fff" stroke="#000"/><text x="-64" y="-101">7</text><line x1="-60" y1="-96" x2="-40" y2="-67" stroke="#000"/>
    </g>
  </g>

  <!-- SIDE VIEW: origin at (330, 560); +X right, +Z up -->
  <g transform="translate(330,560)">
    <text x="-240" y="-120" font-weight="bold">SIDE VIEW (looking along +Y). Z = 0 is the deck top.</text>
    <rect x="-205" y="-3" width="360" height="50" fill="none" stroke="#000" stroke-dasharray="8 5" stroke-width="1.5"/>
    <rect x="-203" y="0" width="356" height="3" fill="#000"/>
    <g fill="none" stroke="#666"><rect x="-101" y="0" width="22" height="41"/><rect x="-41" y="0" width="22" height="41"/><rect x="19" y="0" width="22" height="41"/><rect x="79" y="0" width="22" height="41"/></g>
    <rect x="-24" y="-46" width="48" height="49" fill="url(#hatch)" stroke="#000" stroke-width="1.5"/>
    <rect x="-148" y="-7" width="296" height="5" fill="none" stroke="#000" stroke-dasharray="2 3"/>
    <rect x="-148" y="-38" width="8" height="36" fill="url(#hatch)" stroke="#000"/>
    <rect x="140" y="-38" width="8" height="36" fill="url(#hatch)" stroke="#000"/>
    <line x1="-250" y1="0" x2="-215" y2="0" stroke="#000" stroke-width="2"/><text x="-212" y="4">+X</text>
    <line x1="-250" y1="0" x2="-250" y2="-50" stroke="#000" stroke-width="2"/><text x="-258" y="-56">+Z</text>
    <g font-weight="bold" font-size="12">
      <circle cx="-215" cy="60" r="9" fill="#fff" stroke="#000"/><text x="-219" y="64">1</text>
      <circle cx="165" cy="2" r="9" fill="#fff" stroke="#000"/><text x="161" y="6">2</text>
      <circle cx="-30" cy="60" r="9" fill="#fff" stroke="#000"/><text x="-34" y="64">3</text><line x1="-30" y1="51" x2="-30" y2="41" stroke="#000"/>
      <circle cx="165" cy="-20" r="9" fill="#fff" stroke="#000"/><text x="161" y="-16">4</text><line x1="156" y1="-16" x2="148" y2="-6" stroke="#000"/>
      <circle cx="-165" cy="-45" r="9" fill="#fff" stroke="#000"/><text x="-169" y="-41">5</text><line x1="-157" y1="-41" x2="-148" y2="-36" stroke="#000"/>
      <circle cx="45" cy="-60" r="9" fill="#fff" stroke="#000"/><text x="41" y="-56">6</text><line x1="37" y1="-55" x2="24" y2="-44" stroke="#000"/>
      <!-- grasp Z markers -->
      <line x1="-24" y1="-24" x2="-70" y2="-24" stroke="#000" stroke-dasharray="3 3"/><text x="-120" y="-20" font-weight="normal" font-size="11">grasp Z 12</text>
      <line x1="148" y1="-22" x2="200" y2="-22" stroke="#000" stroke-dasharray="3 3"/><text x="204" y="-18" font-weight="normal" font-size="11">grasp Z 11</text>
    </g>
  </g>

  <!-- LEGEND -->
  <g transform="translate(640,120)" font-size="13">
    <text x="0" y="0" font-weight="bold" font-size="14">Legend (all mm, frame A)</text>
    <g font-weight="bold"><circle cx="8" cy="22" r="9" fill="#fff" stroke="#000"/><text x="4" y="26">1</text></g>
    <text x="24" y="26">Trough (reused, unchanged). X −102.5…77.5, Y ±42.5, Z −23.5…+1.5.</text>
    <text x="24" y="42">Refill bay on the −X end. Sits under the deck.</text>
    <g font-weight="bold"><circle cx="8" cy="64" r="9" fill="#fff" stroke="#000"/><text x="4" y="68">2</text></g>
    <text x="24" y="68">Carrier deck 178 × 83. Deck top Z = 0, plate to Z −1.5.</text>
    <text x="24" y="84">Exported STL is raised +20.5; subtract it on import.</text>
    <g font-weight="bold"><circle cx="8" cy="106" r="9" fill="#fff" stroke="#000"/><text x="4" y="110">3</text></g>
    <text x="24" y="110">Four fused wick pockets at X −45, −15, +15, +45,</text>
    <text x="24" y="126">hanging to Z −20.5. A person loads a paper wick in each.</text>
    <g font-weight="bold"><circle cx="8" cy="148" r="9" fill="#fff" stroke="#000"/><text x="4" y="152">4</text></g>
    <text x="24" y="152">Retainer ring 148 × 66, opening 140 × 58, 2.4 thick,</text>
    <text x="24" y="168">seated at Z +1 on the paper. Centred at X = 0 (NOT on the trough centre).</text>
    <g font-weight="bold"><circle cx="8" cy="190" r="9" fill="#fff" stroke="#000"/><text x="4" y="194">5</text></g>
    <text x="24" y="194">Frame grasp fins at (±72, 0, 11): 4 thick along X, 20 long along Y,</text>
    <text x="24" y="210">Z +1…+19. Jaws close across X.</text>
    <g font-weight="bold"><circle cx="8" cy="232" r="9" fill="#fff" stroke="#000"/><text x="4" y="236">6</text></g>
    <text x="24" y="236">Carrier grasp fins at (0, ±36.5, 12): 24 long along X, 6 thick along Y,</text>
    <text x="24" y="252">Z −1.5…+23. Jaws close across Y.</text>
    <g font-weight="bold"><circle cx="8" cy="274" r="9" fill="#fff" stroke="#000"/><text x="4" y="278">7</text></g>
    <text x="24" y="278">Gap between ring edge (Y 33) and fin inner face (Y 33.5): 0.5 nominal.</text>
    <text x="24" y="294">Bench-test the printed fit before calling the frame a drop-in.</text>

    <rect x="0" y="320" width="440" height="150" fill="none" stroke="#000"/>
    <text x="10" y="340" font-weight="bold">Not drawn because not measured</text>
    <text x="10" y="360">T_robot_from_A (fixture pose in the robot frame)</text>
    <text x="10" y="378">Table plane, tool centre point, camera extrinsics</text>
    <text x="10" y="396">Safe approach height, grasp orientation, swept paths</text>
    <text x="10" y="414">Source stations: loose carrier, paper stack, frame</text>
    <text x="10" y="432">The trough fixture (nest_cress.stl is only a candidate;</text>
    <text x="10" y="450">its pocket assumes a plain 180 × 85 outline)</text>
  </g>
</svg>
