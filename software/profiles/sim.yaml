# Simulator profile: same program, fakes behind the adapter interface. Records carry simulated=true.
profile: sim
simulated: true
data_dir: data-sim
viewer_port: 8765
keyframes_file: keyframes-sim.yaml
robot: {kind: sim, id: sim_xlerobot, max_relative_target: 8, wheels: false}
cameras:
  head:        {match: "sim", width: 640, height: 480, fps: 30}
  left_wrist:  {match: "sim", width: 640, height: 480, fps: 30}
  right_wrist: {match: "sim", width: 640, height: 480, fps: 30}
light: {enabled: true, port: "sim", max_age_s: 1.0, samples: 10, settle_s: 0.05}
arms: {bottle: right, paddle: left}
trays:
  A: {nest: left_front,  kind: cress-wick, tag_id: 1}
  B: {nest: right_front, kind: cress-wick, tag_id: 2}
limits: {pour_tilt_max_deg: 40, pour_s_max: 4, servo_temp_max_c: 55, servo_load_max: 800, watchdog_s: 0.5, step_deg_max: 6, llm_servo_max_steps: 12}
deadlines: {identify_s: 5, inspect_s: 5, measure_s: 5, ask_s: 5, pick_s: 5, approach_s: 5, pour_s: 5, verify_s: 5, park_s: 5}
llm: {backend: sim, vision_model: anthropic/claude-sonnet-5, jev_model: typesafe/jev-router, astra_model: openai/gpt-6-astra, max_cost_usd_per_day: 1, timeout_s: 30}
authority: {jev: approve, astra: propose, jev_approve_min_p: 0.85, jev_shadow_cycles: 2}
