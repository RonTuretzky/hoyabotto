# Farm profile: two paper trays in fixed nests, one bottle, one light paddle.
# Fill in ports and camera identities from `farm devices` after the robot is assembled.
profile: paper-tray-v0
simulated: false
data_dir: data
viewer_port: 8765
keyframes_file: keyframes.yaml

robot:
  kind: lerobot
  id: farm_xlerobot
  port1: "/dev/cu.usbmodem5B790186401"            # bus 1 = left arm (IDs 1-6) + head (7-8); e.g. /dev/tty.usbmodem58A60000001
  port2: "/dev/cu.usbmodem5B790182091"            # bus 2 = right arm (IDs 1-6) + wheels (9-10)
  max_relative_target: 8
  wheels: false
  position_settings:
    right_arm_elbow_flex:
      P_Coefficient: 32               # verified recovery and small move/return under gravity
      Torque_Limit: 400               # tested 40% torque cap
      Goal_Velocity: 100              # tested low position-mode speed
    right_arm_gripper:
      P_Coefficient: 32               # verified small movement-and-return with this response
      Torque_Limit: 500               # reduce the claw's torque cap to 50%
      Goal_Velocity: 200              # explicit low position-mode speed

cameras:               # identity by device name substring, never by index
  head:        {index_or_path: 0, match: "head", width: 640, height: 480, fps: 30}
  left_wrist:  {index_or_path: 1, match: "left", width: 640, height: 480, fps: 30}
  right_wrist: {index_or_path: 2, match: "right", width: 640, height: 480, fps: 30}

light:
  enabled: true
  port: ""             # ESP32 serial; empty = auto-detect
  baud: 115200
  max_age_s: 1.0
  samples: 10
  settle_s: 0.5

arms:
  bottle: right
  paddle: left

trays:
  A: {nest: left_front,  kind: cress-wick,  tag_id: 1, refill_ml_target: 30}
  B: {nest: right_front, kind: cress-wick,  tag_id: 2, refill_ml_target: 30}

limits:
  pour_tilt_max_deg: 40
  pour_s_max: 4
  servo_load_max: 800
  watchdog_s: 0.5
  step_deg_max: 6
  llm_servo_max_steps: 40

deadlines: {identify_s: 10, inspect_s: 20, measure_s: 15, ask_s: 600, pick_s: 30, approach_s: 30, pour_s: 8, verify_s: 20, park_s: 30}

llm:
  backend: claude-cli                 # Claude subscription via the claude CLI; falls back to openrouter
  vision_model: anthropic/claude-sonnet-5
  jev_model: typesafe/jev-router
  astra_model: openai/gpt-6-astra
  max_cost_usd_per_day: 5
  timeout_s: 120

authority:
  jev: route            # shadow -> route -> approve. "approve" lets Jev authorize routine pours after jev_shadow_cycles.
  astra: propose        # shadow -> propose -> apply-safe (only whitelisted numeric config changes)
  jev_approve_min_p: 0.85
  jev_shadow_cycles: 10
  notify_webhook: ""    # optional chat webhook (POST JSON {text, evidence}) for questions

policy:                # learned policy for one skill (v2). Off until a checkpoint has beaten the keyframe skill on held-out episodes.
  enabled: false
  skill: pour
  checkpoint: ""       # e.g. data-train/act_so101_pour/checkpoints/last/pretrained_model
  device: mps
  server_url: ""       # http://<training-mac>:8766 to run the model on another machine (farm policy-server there)
  timeout_s: 2.0
  state_joints: [right_arm_shoulder_pan, right_arm_shoulder_lift, right_arm_elbow_flex, right_arm_wrist_flex, right_arm_wrist_roll, right_arm_gripper]
  camera_map: {observation.images.wrist: right_wrist, observation.images.front: head}
  hz: 10
  max_steps: 300
  shadow: true
